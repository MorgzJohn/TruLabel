<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a0f" />
    <meta
      name="description"
      content="TruLabel — Minimalist Agentic AI Verification for Packaged Food Claims & Healthier Alternatives"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>TruLabel — Truth in Packaged Food Marketing</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #08090d;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      body {
        min-height: 100vh;
        background: radial-gradient(circle at 50% -10%, rgba(16, 185, 129, 0.07) 0%, rgba(8, 9, 13, 0) 50%),
                    radial-gradient(circle at 90% 20%, rgba(56, 189, 248, 0.04) 0%, rgba(8, 9, 13, 0) 40%),
                    #08090d;
        background-attachment: fixed;
      }
      ::selection {
        background: rgba(16, 185, 129, 0.25);
        color: #34d399;
      }
      /* Sleek Minimalist Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      button, input, textarea, select {
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
